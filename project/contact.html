    <!-- Contact page -->
    <main class="contact">
        <h1>Contact Us</h1>
        <p>Have a question or suggestion? We'd love to hear from you.</p>
        <form action="#" method="Post">
            <p>Full Name:</p>
            <input type="text" name="name" placeholder="Enter Here" required>
            <p>Email Address:</p>
            <input type="email" name="email" placeholder="Enter Here" required>
            <p>Subject</p>
            <input type="text" name="subject" placeholder="Enter Here" required>
            <p>Message:</p>
            <textarea name="message" rows="6" placeholder="Enter Here" required></textarea>
            <button class="button" type="submit">Send</button>
        </form>
        </main>
