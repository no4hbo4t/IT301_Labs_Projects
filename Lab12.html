<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab12</title>
</head>
<body>
    <h1>Basic Calculator</h1>
    <label for="name">Enter your name:</label>
    <input type="text" id="name">
    <button id="greetBtn">Greet</button>
    <p id="greeting"></p>
    <label for="num1">First Number:</label>
    <input type="number" id="num1">
    <br>
    <label for="num2">Second Number:</label>
    <input type="number" id="num2">
    <br>
    <input type="radio" name="operation" value="add" id="add">
    <label for="add">Addition</label><br>
    <input type="radio" name="operation" value="subtract" id="subtract">
    <label for="subtract">Subtraction</label><br>
    <input type="radio" name="operation" value="multiply" id="multiply">
    <label for="multiply">Multiplication</label><br>
    <input type="radio" name="operation" value="divide" id="divide">
    <label for="divide">Division</label><br>
    <br>
    <button id="calculateBtn">Calculate</button>
    <button id="clearBtn">Clear</button>
    <p id="result"></p>
    <script>
        function greetUser() {
            let name = document.getElementById("name").value;
            document.getElementById("greeting").textContent = "Hello, " + name;
        }
        document.getElementById("greetBtn").addEventListener("click", greetUser);
        function calculate() {
            let num1 = document.getElementById("num1").value;
            let num2 = document.getElementById("num2").value;
            let operation = document.querySelector('input[name="operation"]:checked');
            let result = document.getElementById("result");
            if (num1 === "" || num2 === "" || operation === null) {
                result.textContent = "Enter two numbers and select an operation.";
                return;
            }
            num1 = Number(num1);
            num2 = Number(num2);
            let answer;
            if (operation.value === "add") {
                answer = num1 + num2;
            }
            else if (operation.value === "subtract") {
                answer = num1 - num2;
            }
            else if (operation.value === "multiply") {
                answer = num1 * num2;
            }
            else if (operation.value === "divide") {
                if (num2 === 0) {
                    result.textContent = "Cannot divide by zero.";
                    return;
                }
                answer = num1 / num2;
            }
            result.textContent = "Result: " + answer;
        }
        document.getElementById("calculateBtn").addEventListener("click", calculate);
        function clearScreen() {
            document.getElementById("name").value = "";
            document.getElementById("num1").value = "";
            document.getElementById("num2").value = "";
            document.getElementById("greeting").textContent = "";
            document.getElementById("result").textContent = "";
            let operation = document.querySelector('input[name="operation"]:checked');
            if (operation !== null) {
                operation.checked = false;
            }
        }
        document.getElementById("clearBtn").addEventListener("click", clearScreen);
    </script>
</body>
</html>
