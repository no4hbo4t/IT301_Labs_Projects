<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        *{
            margin: 0;
        }
        #flexparent{
            height: 100vh;
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;
        }
        div div{
            width: 200px;
            height: 100px;
            text-align: center;
            align-content: center;
        }
    </style>
</head>
<body>
    <div id="flexparent"> 
        <img id="child1" src="https://picsum.photos/150/150?random=1">
        <img id="child2" src="https://picsum.photos/250/250?random=2">
        <img id="child3" src="https://picsum.photos/150/150?random=3">
     
    </div>
</body>
</html>
